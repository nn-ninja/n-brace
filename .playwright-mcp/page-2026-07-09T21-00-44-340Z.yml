    - generic [ref=f7e26]:
      - generic [ref=f7e27]:
        - heading "N-brace" [level=1] [ref=f7e28]
        - paragraph [ref=f7e29]: Embrace your brain.
      - article [ref=f7e30]:
        - generic [ref=f7e31]:
          - paragraph [ref=f7e32]:
            - strong [ref=f7e33]: n-brace
            - text: is a standalone, offline-first app for visualizing and navigating your notes as a graph mind map. It’s designed around the
            - emphasis [ref=f7e34]: Pocket Brain
            - text: technique and helps you move smoothly through large knowledge networks.
          - generic [ref=f7e35]:
            - img "n-brace app screenshot" [ref=f7e38]
            - button "Previous" [ref=f7e39] [cursor=pointer]
            - button "Next" [ref=f7e42] [cursor=pointer]
          - paragraph [ref=f7e45]:
            - text: N-brace is available now as a
            - strong [ref=f7e46]: free standalone app
            - text: for Windows, macOS and Linux, and is under
            - strong [ref=f7e47]: active development
            - text: . If you’re an Obsidian user, the
            - link "Obsidian plugin" [ref=f7e48] [cursor=pointer]:
              - /url: /n-brace/projects/obsidian_plugin/
            - text: is still around and supported, but the standalone app is where new features land first. If you find it useful, you can
            - link "buy me a coffee" [ref=f7e49] [cursor=pointer]:
              - /url: https://buymeacoffee.com/nbrace
            - text: — free hugs for all supporters ☕🤗
          - separator [ref=f7e50]
          - heading "Features" [level=2] [ref=f7e51]
          - list [ref=f7e52]:
            - listitem [ref=f7e53]:
              - strong [ref=f7e54]: Seamless navigation
              - text: – show only the local part of the graph you’re currently exploring, move through linked notes, jump between nodes with keyboard shortcuts, and let automatic layout keep everything readable so you never have to adjust nodes by hand.
            - listitem [ref=f7e55]:
              - strong [ref=f7e56]: Quick graph manipulation
              - text: – a radial pie menu puts create, link, group and move actions one click away, right where your cursor is, so reshaping the map never breaks your flow.
            - listitem [ref=f7e57]:
              - strong [ref=f7e58]: Tag area view layer
              - text: – tags render as colored regions overlaid directly on the canvas, so you can see at a glance which cluster or topic a note belongs to, and filter the view down to just the layers you care about.
            - listitem [ref=f7e59]:
              - strong [ref=f7e60]: Edge tags for deep structures
              - text: – links themselves can carry a tag, turning a simple connection into a labeled layer. The same idea can sit in many contexts at once without duplicating notes, letting deep, cross-cutting structures emerge from a flat graph.
            - listitem [ref=f7e61]:
              - strong [ref=f7e62]: MCP server for AI integration
              - text: – a built-in
              - link "MCP" [ref=f7e63] [cursor=pointer]:
                - /url: https://modelcontextprotocol.io
              - text: server exposes your note graph to AI assistants like Claude Desktop and Claude Code, so they can search your notes and import web articles as structured, tagged nodes directly into your map.
            - listitem [ref=f7e64]:
              - strong [ref=f7e65]: Multiple implementations
              - text: – use n-brace as a standalone offline-first desktop app, or as an
              - link "Obsidian plugin" [ref=f7e66] [cursor=pointer]:
                - /url: /n-brace/projects/obsidian_plugin/
              - text: if you’d rather stay inside your existing vault.
            - listitem [ref=f7e67]:
              - strong [ref=f7e68]: Interactive and mobile-friendly
              - text: – works smoothly on desktop and mobile devices «not yet».
