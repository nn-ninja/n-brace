            - text: — free hugs for all supporters ☕🤗
          - paragraph [ref=f82e68]:
            - text: If you’re an Obsidian user, the
            - link "Obsidian plugin" [ref=f82e69] [cursor=pointer]:
              - /url: /n-brace/projects/obsidian_plugin/
            - text: is still around and supported, but the standalone app is where new features land first.
          - separator [ref=f82e70]
          - heading "Features" [level=2] [ref=f82e71]
          - list [ref=f82e72]:
            - listitem [ref=f82e73]:
              - strong [ref=f82e74]: Seamless navigation
              - text: – show only the local part of the graph you’re currently exploring, move through linked notes, jump between nodes with keyboard shortcuts, and let automatic layout keep everything readable.
            - listitem [ref=f82e75]:
              - strong [ref=f82e76]: Quick graph manipulation
              - text: – a radial pie menu puts create, link, group and move actions one click away, right where your cursor is, so reshaping the map never breaks your flow.
            - listitem [ref=f82e77]:
              - strong [ref=f82e78]: Tag area view layer
              - text: – tags render as colored regions overlaid directly on the canvas, so you can see at a glance which cluster or topic a note belongs to, and filter the view down to just the layers you care about.
            - listitem [ref=f82e79]:
              - strong [ref=f82e80]: Deep structure
              - text: – A note can have many flavors, contextual contents, letting deep, cross-cutting structures emerge from a flat graph.
            - listitem [ref=f82e81]:
              - strong [ref=f82e82]: Reminders
              - text: – set reminders on any note to resurface repeating tasks, refresh knowledge you don’t want to forget, or manage household chores, right from your graph.
            - listitem [ref=f82e83]:
              - strong [ref=f82e84]: MCP server for AI integration
              - text: – a built-in
              - link "MCP" [ref=f82e85] [cursor=pointer]:
                - /url: https://modelcontextprotocol.io
              - text: server exposes your note graph to AI assistants like Claude Desktop and Claude Code, so they can search your notes and import web articles as structured, tagged nodes directly into your map.
            - listitem [ref=f82e86]:
              - strong [ref=f82e87]: Interactive and mobile-friendly
              - text: – works smoothly on desktop and mobile devices «not yet».
